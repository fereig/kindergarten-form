<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روضة النور — تسجيل الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Tajawal', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 8px 40px rgba(0,0,0,0.1); }
  .header { text-align: center; margin-bottom: 32px; }
  .logo { font-size: 48px; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; color: #1a1a2e; }
  .header p { color: #666; font-size: 14px; margin-top: 4px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 28px; }
  .tab-btn { padding: 12px; border: 2px solid #e8ecf0; border-radius: 12px; background: #f8fafc; cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 700; color: #666; transition: all 0.2s; text-align: center; }
  .tab-btn.active-attendance { border-color: #4f8ef7; background: #eff6ff; color: #1d4ed8; }
  .tab-btn.active-incident { border-color: #ef4444; background: #fef2f2; color: #dc2626; }
  .section { display: none; }
  .section.active { display: block; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; font-size: 15px; }
  select, input, textarea { width: 100%; padding: 14px 16px; border: 2px solid #e8ecf0; border-radius: 12px; font-family: 'Tajawal', sans-serif; font-size: 15px; color: #1a1a2e; background: #f8fafc; outline: none; transition: border-color 0.2s; }
  textarea { resize: none; height: 100px; }
  select:focus, input:focus, textarea:focus { border-color: #4f8ef7; background: white; }
  .status-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .status-btn { padding: 16px; border: 2px solid #e8ecf0; border-radius: 12px; background: #f8fafc; cursor: pointer; text-align: center; font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 700; color: #666; transition: all 0.2s; }
  .status-btn .icon { font-size: 24px; display: block; margin-bottom: 4px; }
  .status-btn.active-checkin { border-color: #22c55e; background: #f0fdf4; color: #16a34a; }
  .status-btn.active-checkout { border-color: #f97316; background: #fff7ed; color: #ea580c; }
  .severity-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .severity-btn { padding: 12px 8px; border: 2px solid #e8ecf0; border-radius: 12px; background: #f8fafc; cursor: pointer; text-align: center; font-family: 'Tajawal', sans-serif; font-size: 13px; font-weight: 700; color: #666; transition: all 0.2s; }
  .severity-btn.active-low { border-color: #22c55e; background: #f0fdf4; color: #16a34a; }
  .severity-btn.active-medium { border-color: #f97316; background: #fff7ed; color: #ea580c; }
  .severity-btn.active-high { border-color: #ef4444; background: #fef2f2; color: #dc2626; }
  .submit-btn { width: 100%; padding: 16px; background: #1a1a2e; color: white; border: none; border-radius: 12px; font-family: 'Tajawal', sans-serif; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
  .submit-btn.incident-btn { background: #dc2626; }
  .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .submit-btn:disabled { background: #999; cursor: not-allowed; transform: none; }
  .success { display: none; text-align: center; padding: 24px; background: #f0fdf4; border-radius: 16px; margin-top: 20px; }
  .success.incident-success { background: #fef2f2; }
  .success .icon { font-size: 48px; }
  .success p { color: #16a34a; font-weight: 700; font-size: 16px; margin-top: 8px; }
  .success.incident-success p { color: #dc2626; }
  .time-display { background: #f8fafc; border: 2px solid #e8ecf0; border-radius: 12px; padding: 14px 16px; font-size: 15px; color: #1a1a2e; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">🏫</div>
    <h1>روضة النور</h1>
    <p>نظام تسجيل الحضور والانصراف</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active-attendance" onclick="switchTab('attendance')">✅ تسجيل الحضور</button>
    <button class="tab-btn" onclick="switchTab('incident')">🚨 بلاغ حادثة</button>
  </div>

  <!-- Attendance -->
  <div class="section active" id="attendanceSection">
    <div class="form-group">
      <label>👦 اسم الطفل</label>
      <select id="child">
        <option value="">اختاري الطفل...</option>
        <option value="KG-001|Ahmed">Ahmed</option>
        <option value="KG-002|seif">seif</option>
      </select>
    </div>
    <div class="form-group">
      <label>👩‍🏫 اسم المعلمة</label>
      <select id="teacher">
        <option value="">اختاري اسمك...</option>
        <option value="Miss Sara">Miss Sara</option>
        <option value="Miss magda">Miss magda</option>
        <option value="Miss نورا">Miss نورا</option>
      </select>
    </div>
    <div class="form-group">
      <label>🕐 الوقت الحالي</label>
      <div class="time-display" id="timeDisplay"></div>
    </div>
    <div class="form-group">
      <label>النوع</label>
      <div class="status-buttons">
        <button class="status-btn" id="checkinBtn" onclick="selectStatus('check-in')">
          <span class="icon">✅</span>حضور
        </button>
        <button class="status-btn" id="checkoutBtn" onclick="selectStatus('check-out')">
          <span class="icon">👋</span>انصراف
        </button>
      </div>
    </div>
    <button class="submit-btn" onclick="submitAttendance()">إرسال</button>
    <div class="success" id="attendanceSuccess">
      <div class="icon">🎉</div>
      <p id="attendanceSuccessText">تم التسجيل بنجاح!</p>
    </div>
  </div>

  <!-- Incident -->
  <div class="section" id="incidentSection">
    <div class="form-group">
      <label>👦 اسم الطفل</label>
      <select id="incidentChild">
        <option value="">اختاري الطفل...</option>
        <option value="KG-001|Ahmed">Ahmed</option>
        <option value="KG-002|omar">omar</option>
        <option value="KG-003|seif">seif</option>
      </select>
    </div>
    <div class="form-group">
      <label>👩‍🏫 اسم المعلمة</label>
      <select id="incidentTeacher">
        <option value="">اختاري اسمك...</option>
        <option value="Miss Sara">Miss Sara</option>
        <option value="Miss magda">Miss magda</option>
        <option value="Miss نورا">Miss نورا</option>
      </select>
    </div>
    <div class="form-group">
      <label>🚨 إيه اللي حصل؟</label>
      <textarea id="incidentDesc" placeholder="اكتبي تفاصيل الحادثة..."></textarea>
    </div>
    <div class="form-group">
      <label>📊 درجة الخطورة</label>
      <div class="severity-buttons">
        <button class="severity-btn" id="lowBtn" onclick="selectSeverity('بسيط')">🟢 بسيط</button>
        <button class="severity-btn" id="mediumBtn" onclick="selectSeverity('متوسط')">🟡 متوسط</button>
        <button class="severity-btn" id="highBtn" onclick="selectSeverity('خطير')">🔴 خطير</button>
      </div>
    </div>
    <button class="submit-btn incident-btn" onclick="submitIncident()">🚨 إرسال البلاغ</button>
    <div class="success incident-success" id="incidentSuccess">
      <div class="icon">📨</div>
      <p>تم إرسال البلاغ للأهل فوراً!</p>
    </div>
  </div>
</div>

<script>
  const CHECKIN_URL = 'https://fereig202.app.n8n.cloud/webhook/e628a658-f6f0-430f-943a-6cfab5ca6ca8';
  const INCIDENT_URL = 'https://fereig202.app.n8n.cloud/webhook/8a558d80-7447-477d-a075-200d9d958373';
  let selectedStatus = '';
  let selectedSeverity = '';

  function updateTime() {
    const now = new Date();
    document.getElementById('timeDisplay').textContent = now.toLocaleDateString('ar-EG') + ' — ' + now.toLocaleTimeString('ar-EG', {hour:'2-digit',minute:'2-digit'});
  }
  updateTime();
  setInterval(updateTime, 1000);

  function switchTab(tab) {
    document.getElementById('attendanceSection').className = 'section' + (tab==='attendance' ? ' active' : '');
    document.getElementById('incidentSection').className = 'section' + (tab==='incident' ? ' active' : '');
    document.querySelectorAll('.tab-btn')[0].className = 'tab-btn' + (tab==='attendance' ? ' active-attendance' : '');
    document.querySelectorAll('.tab-btn')[1].className = 'tab-btn' + (tab==='incident' ? ' active-incident' : '');
  }

  function selectStatus(s) {
    selectedStatus = s;
    document.getElementById('checkinBtn').className = 'status-btn' + (s==='check-in' ? ' active-checkin' : '');
    document.getElementById('checkoutBtn').className = 'status-btn' + (s==='check-out' ? ' active-checkout' : '');
  }

  function selectSeverity(s) {
    selectedSeverity = s;
    document.getElementById('lowBtn').className = 'severity-btn' + (s==='بسيط' ? ' active-low' : '');
    document.getElementById('mediumBtn').className = 'severity-btn' + (s==='متوسط' ? ' active-medium' : '');
    document.getElementById('highBtn').className = 'severity-btn' + (s==='خطير' ? ' active-high' : '');
  }

  function getTimestamp() {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  }

  async function submitAttendance() {
    const childVal = document.getElementById('child').value;
    const teacher = document.getElementById('teacher').value;
    if (!childVal || !teacher || !selectedStatus) { alert('من فضلك اكملي كل الحقول'); return; }
    const [childId, childName] = childVal.split('|');
    document.getElementById('attendanceSuccess').style.display = 'none';
    try {
      await fetch(CHECKIN_URL, { method:'POST', headers:{'Content-Type':'application/json'}, mode:'no-cors', body: JSON.stringify({ child_name:childName, child_id:childId, teacher_name:teacher, timestamp:getTimestamp(), status:selectedStatus }) });
      document.getElementById('attendanceSuccessText').textContent = (selectedStatus==='check-in' ? 'تم تسجيل حضور ' : 'تم تسجيل انصراف ') + childName + ' ✅';
      document.getElementById('attendanceSuccess').style.display = 'block';
      document.getElementById('child').value = '';
      selectedStatus = '';
      document.getElementById('checkinBtn').className = 'status-btn';
      document.getElementById('checkoutBtn').className = 'status-btn';
    } catch(e) { alert('حصل خطأ، حاولي تاني'); }
  }

  async function submitIncident() {
    const childVal = document.getElementById('incidentChild').value;
    const teacher = document.getElementById('incidentTeacher').value;
    const desc = document.getElementById('incidentDesc').value;
    if (!childVal || !teacher || !desc || !selectedSeverity) { alert('من فضلك اكملي كل الحقول'); return; }
    const [childId, childName] = childVal.split('|');
    document.getElementById('incidentSuccess').style.display = 'none';
    try {
      await fetch(INCIDENT_URL, { method:'POST', headers:{'Content-Type':'application/json'}, mode:'no-cors', body: JSON.stringify({ child_name:childName, child_id:childId, teacher_name:teacher, incident:desc, severity:selectedSeverity, timestamp:getTimestamp() }) });
      document.getElementById('incidentSuccess').style.display = 'block';
      document.getElementById('incidentChild').value = '';
      document.getElementById('incidentDesc').value = '';
      selectedSeverity = '';
      document.getElementById('lowBtn').className = 'severity-btn';
      document.getElementById('mediumBtn').className = 'severity-btn';
      document.getElementById('highBtn').className = 'severity-btn';
    } catch(e) { alert('حصل خطأ، حاولي تاني'); }
  }
</script>
</body>
</html>
