<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روضة النور — نظام الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #0f3460;
    --gold: #f5a623;
    --success: #00b894;
    --warning: #fdcb6e;
    --card: #16213e;
    --card2: #0f3460;
    --text: #eaeaea;
    --muted: #8892a4;
    --border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--primary);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(233,69,96,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(15,52,96,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 60% 80%, rgba(245,166,35,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 0 32px;
    animation: fadeDown 0.6s ease both;
  }

  .logo-ring {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 8px 32px rgba(233,69,96,0.4), 0 0 0 8px rgba(233,69,96,0.08);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(233,69,96,0.4), 0 0 0 8px rgba(233,69,96,0.08); }
    50% { box-shadow: 0 8px 48px rgba(233,69,96,0.6), 0 0 0 16px rgba(233,69,96,0.04); }
  }

  .header h1 {
    font-family: 'Tajawal', sans-serif;
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #fff 30%, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
    font-weight: 500;
  }

  /* Tab switcher */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 24px;
    background: var(--card);
    padding: 6px;
    border-radius: 16px;
    border: 1px solid var(--border);
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .tab {
    padding: 12px 8px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .tab .tab-icon { font-size: 20px; }

  .tab.active {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: white;
    box-shadow: 0 4px 16px rgba(233,69,96,0.35);
  }

  .tab.active-green {
    background: linear-gradient(135deg, var(--success), #00695c);
    color: white;
    box-shadow: 0 4px 16px rgba(0,184,148,0.35);
  }

  .tab.active-gold {
    background: linear-gradient(135deg, var(--gold), #e67e22);
    color: white;
    box-shadow: 0 4px 16px rgba(245,166,35,0.35);
  }

  .tab:hover:not(.active):not(.active-green):not(.active-gold) {
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    margin-bottom: 16px;
    animation: fadeUp 0.6s 0.15s ease both;
    display: none;
  }

  .card.visible { display: block; }

  .card-title {
    font-family: 'Tajawal', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .dot-green { background: var(--success) !important; box-shadow: 0 0 8px var(--success) !important; }
  .dot-gold { background: var(--gold) !important; box-shadow: 0 0 8px var(--gold) !important; }

  /* Form elements */
  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, select, textarea {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    transition: all 0.2s ease;
    outline: none;
    -webkit-appearance: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: rgba(233,69,96,0.5);
    background: rgba(233,69,96,0.05);
    box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
  }

  select option { background: var(--primary); }

  textarea { resize: none; min-height: 100px; }

  /* Row layout */
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* Severity buttons */
  .severity-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .sev-btn {
    padding: 12px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }

  .sev-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  
  .sev-btn.selected-low {
    background: rgba(0,184,148,0.15);
    border-color: var(--success);
    color: var(--success);
  }
  .sev-btn.selected-mid {
    background: rgba(253,203,110,0.15);
    border-color: var(--warning);
    color: var(--warning);
  }
  .sev-btn.selected-high {
    background: rgba(233,69,96,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Submit button */
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-family: 'Tajawal', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-top: 8px;
    letter-spacing: 0.3px;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.1);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn:hover::after { opacity: 1; }
  .btn:active { transform: scale(0.98); }

  .btn-checkin {
    background: linear-gradient(135deg, #00b894, #00695c);
    color: white;
    box-shadow: 0 6px 24px rgba(0,184,148,0.3);
  }

  .btn-checkout {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: white;
    box-shadow: 0 6px 24px rgba(233,69,96,0.3);
  }

  .btn-incident {
    background: linear-gradient(135deg, var(--gold), #e67e22);
    color: white;
    box-shadow: 0 6px 24px rgba(245,166,35,0.3);
  }

  /* Status bar */
  .status-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .time-display {
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 14px;
    font-weight: 600;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 260px;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(0,184,148,0.4); color: var(--success); }
  .toast.error { border-color: rgba(233,69,96,0.4); color: var(--accent); }
  .toast.loading { border-color: rgba(245,166,35,0.4); color: var(--gold); }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Spinner */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .btn.loading .spinner { display: inline-block; }
  .btn.loading .btn-text { opacity: 0.7; }

  .tab.active-purple {
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    color: white;
    box-shadow: 0 4px 16px rgba(108,92,231,0.35);
  }

  /* Required star */
  .req { color: var(--accent); margin-right: 2px; }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo-ring">🌸</div>
    <h1>روضة النور</h1>
    <p>نظام إدارة الحضور والإشعارات</p>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-item">
      <div class="status-dot"></div>
      <span>النظام يعمل</span>
    </div>
    <div class="time-display" id="clock">--:--</div>
    <div class="status-item" style="color: var(--muted); font-size: 12px;" id="dateDisplay">--</div>
  </div>

  <!-- Tabs -->
  <div class="tabs" style="grid-template-columns: repeat(4, 1fr);">
    <button class="tab active" onclick="switchTab('checkin', this, 'active')" id="tab-checkin">
      <span class="tab-icon">✅</span>
      <span>حضور</span>
    </button>
    <button class="tab" onclick="switchTab('checkout', this, 'active-green')" id="tab-checkout">
      <span class="tab-icon">👋</span>
      <span>انصراف</span>
    </button>
    <button class="tab" onclick="switchTab('incident', this, 'active-gold')" id="tab-incident">
      <span class="tab-icon">⚠️</span>
      <span>حادثة</span>
    </button>
    <button class="tab" onclick="switchTab('notes', this, 'active-purple')" id="tab-notes">
      <span class="tab-icon">📝</span>
      <span>ملاحظات</span>
    </button>
  </div>

  <!-- Check-in Card -->
  <div class="card visible" id="card-checkin">
    <div class="card-title">
      <div class="dot dot-green"></div>
      تسجيل الحضور
    </div>

    <div class="field">
      <label><span class="req">*</span> اسم الطفل</label>
      <select id="ci-child">
        <option value="">— اختر الطفل —</option>
        <option value="KG-001|Ahmed">Ahmed</option>
        <option value="KG-002|seif">Seif</option>
      </select>
    </div>

    <div class="field">
      <label><span class="req">*</span> المعلمة المسؤولة</label>
      <select id="ci-teacher">
        <option value="">— اختر المعلمة —</option>
        <option value="Miss Sara">Miss Sara</option>
        <option value="Miss Magda">Miss Magda</option>
      </select>
    </div>

    <button class="btn btn-checkin" onclick="submit('checkin')" id="btn-checkin">
      <span class="spinner"></span>
      <span class="btn-text">✅ &nbsp; تسجيل الحضور وإشعار الأهل</span>
    </button>
  </div>

  <!-- Check-out Card -->
  <div class="card" id="card-checkout">
    <div class="card-title">
      <div class="dot"></div>
      تسجيل الانصراف
    </div>

    <div class="field">
      <label><span class="req">*</span> اسم الطفل</label>
      <select id="co-child">
        <option value="">— اختر الطفل —</option>
        <option value="KG-001|Ahmed">Ahmed</option>
        <option value="KG-002|seif">Seif</option>
      </select>
    </div>

    <div class="field">
      <label><span class="req">*</span> المعلمة المسؤولة</label>
      <select id="co-teacher">
        <option value="">— اختر المعلمة —</option>
        <option value="Miss Sara">Miss Sara</option>
        <option value="Miss Magda">Miss Magda</option>
      </select>
    </div>

    <button class="btn btn-checkout" onclick="submit('checkout')" id="btn-checkout">
      <span class="spinner"></span>
      <span class="btn-text">👋 &nbsp; تسجيل الانصراف وإشعار الأهل</span>
    </button>
  </div>

  <!-- Incident Card -->
  <div class="card" id="card-incident">
    <div class="card-title">
      <div class="dot dot-gold"></div>
      تقرير حادثة
    </div>

    <div class="row">
      <div class="field">
        <label><span class="req">*</span> اسم الطفل</label>
        <select id="inc-child">
          <option value="">— اختر —</option>
          <option value="KG-001|Ahmed">Ahmed</option>
          <option value="KG-002|seif">Seif</option>
        </select>
      </div>
      <div class="field">
        <label><span class="req">*</span> المعلمة</label>
        <select id="inc-teacher">
          <option value="">— اختر —</option>
          <option value="Miss Sara">Miss Sara</option>
          <option value="Miss Magda">Miss Magda</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label><span class="req">*</span> وصف الحادثة</label>
      <textarea id="inc-desc" placeholder="اكتب وصف مختصر للحادثة..."></textarea>
    </div>

    <div class="field">
      <label><span class="req">*</span> درجة الخطورة</label>
      <div class="severity-grid">
        <button class="sev-btn" onclick="selectSeverity('بسيط', this, 'selected-low')">🟢 بسيط</button>
        <button class="sev-btn" onclick="selectSeverity('متوسط', this, 'selected-mid')">🟡 متوسط</button>
        <button class="sev-btn" onclick="selectSeverity('خطير', this, 'selected-high')">🔴 خطير</button>
      </div>
    </div>

    <button class="btn btn-incident" onclick="submit('incident')" id="btn-incident">
      <span class="spinner"></span>
      <span class="btn-text">⚠️ &nbsp; إرسال التقرير وتنبيه الأهل فوراً</span>
    </button>
  </div>

  <!-- Notes Card -->
  <div class="card" id="card-notes">
    <div class="card-title">
      <div class="dot" style="background:#6c5ce7; box-shadow: 0 0 8px #6c5ce7;"></div>
      ملاحظات الطفل
    </div>

    <div class="row">
      <div class="field">
        <label><span class="req">*</span> اسم الطفل</label>
        <select id="nt-child">
          <option value="">— اختر —</option>
          <option value="KG-001|Ahmed">Ahmed</option>
          <option value="KG-002|seif">Seif</option>
        </select>
      </div>
      <div class="field">
        <label><span class="req">*</span> المعلمة</label>
        <select id="nt-teacher">
          <option value="">— اختر —</option>
          <option value="Miss Sara">Miss Sara</option>
          <option value="Miss Magda">Miss Magda</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label><span class="req">*</span> نوع الملاحظة</label>
      <div class="severity-grid" style="grid-template-columns: repeat(2,1fr); gap: 8px;">
        <button class="sev-btn" onclick="selectNote('نواقص', this)">🎒 نواقص</button>
        <button class="sev-btn" onclick="selectNote('أكاديمي', this)">📚 أكاديمي</button>
        <button class="sev-btn" onclick="selectNote('سلوكي', this)">🧒 سلوكي</button>
        <button class="sev-btn" onclick="selectNote('أخرى', this)">📌 أخرى</button>
      </div>
    </div>

    <!-- نواقص -->
    <div class="field" id="missing-section" style="display:none;">
      <label>النواقص</label>
      <div class="severity-grid" style="grid-template-columns: repeat(3,1fr);">
        <button class="sev-btn" onclick="toggleMissing('مصروف', this)">💰 مصروف</button>
        <button class="sev-btn" onclick="toggleMissing('شنطة', this)">🎒 شنطة</button>
        <button class="sev-btn" onclick="toggleMissing('ملابس', this)">👕 ملابس</button>
        <button class="sev-btn" onclick="toggleMissing('كتاب', this)">📖 كتاب</button>
        <button class="sev-btn" onclick="toggleMissing('قلم', this)">✏️ قلم</button>
        <button class="sev-btn" onclick="toggleMissing('أخرى', this)">➕ أخرى</button>
      </div>
    </div>

    <!-- أكاديمي -->
    <div class="field" id="academic-section" style="display:none;">
      <label>المجال الأكاديمي</label>
      <div class="severity-grid" style="grid-template-columns: repeat(3,1fr);">
        <button class="sev-btn" onclick="toggleAcademic('القراءة', this)">📖 القراءة</button>
        <button class="sev-btn" onclick="toggleAcademic('الكتابة', this)">✍️ الكتابة</button>
        <button class="sev-btn" onclick="toggleAcademic('الأرقام', this)">🔢 الأرقام</button>
        <button class="sev-btn" onclick="toggleAcademic('الحروف', this)">🔤 الحروف</button>
        <button class="sev-btn" onclick="toggleAcademic('التركيز', this)">🎯 التركيز</button>
        <button class="sev-btn" onclick="toggleAcademic('أخرى', this)">➕ أخرى</button>
      </div>
    </div>

    <div class="field">
      <label>تفاصيل إضافية</label>
      <textarea id="nt-details" placeholder="اكتب أي تفاصيل إضافية..."></textarea>
    </div>

    <button class="btn" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe); box-shadow: 0 6px 24px rgba(108,92,231,0.3);" onclick="submit('notes')" id="btn-notes">
      <span class="spinner"></span>
      <span class="btn-text">📝 &nbsp; حفظ الملاحظة</span>
    </button>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
  // Config — غير الـ URLs دي
  const URLS = {
    checkin:  'https://fereig202.app.n8n.cloud/webhook/e628a658-f6f0-430f-943a-6cfab5ca6ca8',
    checkout: 'https://fereig202.app.n8n.cloud/webhook/checkout-kg',
    incident: 'https://fereig202.app.n8n.cloud/webhook/8a558d80-7447-477d-a075-200d9d958373',
    notes:    'https://fereig202.app.n8n.cloud/webhook/notes-kg'
  };

  let selectedSeverity = '';
  let selectedNoteType = '';
  let selectedMissing = [];
  let selectedAcademic = [];

  function selectNote(val, el) {
    selectedNoteType = val;
    document.querySelectorAll('#card-notes .severity-grid:first-of-type .sev-btn').forEach(b => b.className = 'sev-btn');
    el.classList.add('selected-low');
    document.getElementById('missing-section').style.display = val === 'نواقص' ? 'block' : 'none';
    document.getElementById('academic-section').style.display = val === 'أكاديمي' ? 'block' : 'none';
    selectedMissing = [];
    selectedAcademic = [];
    document.querySelectorAll('#missing-section .sev-btn, #academic-section .sev-btn').forEach(b => b.className = 'sev-btn');
  }

  function toggleMissing(val, el) {
    if (selectedMissing.includes(val)) {
      selectedMissing = selectedMissing.filter(v => v !== val);
      el.className = 'sev-btn';
    } else {
      selectedMissing.push(val);
      el.classList.add('selected-mid');
    }
  }

  function toggleAcademic(val, el) {
    if (selectedAcademic.includes(val)) {
      selectedAcademic = selectedAcademic.filter(v => v !== val);
      el.className = 'sev-btn';
    } else {
      selectedAcademic.push(val);
      el.classList.add('selected-mid');
    }
  }

  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = 
      now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('dateDisplay').textContent = 
      now.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Tab switching
  function switchTab(tab, el, activeClass) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('visible'));
    document.querySelectorAll('.tab').forEach(t => t.className = 'tab');
    document.getElementById('card-' + tab).classList.add('visible');
    el.classList.add(activeClass);
  }

  // Severity
  function selectSeverity(val, el, cls) {
    selectedSeverity = val;
    document.querySelectorAll('.sev-btn').forEach(b => b.className = 'sev-btn');
    el.classList.add(cls);
  }

  // Toast
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // Submit
  async function submit(type) {
    const btn = document.getElementById('btn-' + type);

    let body = {};
    const now = new Date().toISOString();

    if (type === 'checkin') {
      const child = document.getElementById('ci-child').value;
      const teacher = document.getElementById('ci-teacher').value;
      if (!child || !teacher) return showToast('❗ اختر الطفل والمعلمة', 'error');
      const [id, name] = child.split('|');
      body = { child_id: id, child_name: name, teacher_name: teacher, status: 'check-in', timestamp: now };
    }

    if (type === 'checkout') {
      const child = document.getElementById('co-child').value;
      const teacher = document.getElementById('co-teacher').value;
      if (!child || !teacher) return showToast('❗ اختر الطفل والمعلمة', 'error');
      const [id, name] = child.split('|');
      body = { child_id: id, child_name: name, teacher_name: teacher, status: 'check-out', timestamp: now };
    }

    if (type === 'incident') {
      const child = document.getElementById('inc-child').value;
      const teacher = document.getElementById('inc-teacher').value;
      const desc = document.getElementById('inc-desc').value.trim();
      if (!child || !teacher || !desc || !selectedSeverity)
        return showToast('❗ اكمل كل البيانات المطلوبة', 'error');
      const [id, name] = child.split('|');
      body = { child_id: id, child_name: name, teacher_name: teacher, incident: desc, severity: selectedSeverity, timestamp: now };
    }

    if (type === 'notes') {
      const child = document.getElementById('nt-child').value;
      const teacher = document.getElementById('nt-teacher').value;
      const details = document.getElementById('nt-details').value.trim();
      if (!child || !teacher || !selectedNoteType) return showToast('❗ اختر الطفل والمعلمة ونوع الملاحظة', 'error');
      const [id, name] = child.split('|');
      body = {
        child_id: id, child_name: name, teacher_name: teacher,
        note_type: selectedNoteType,
        missing_items: selectedMissing.join('، ') || '-',
        academic_items: selectedAcademic.join('، ') || '-',
        details: details || '-',
        timestamp: now
      };
    }

    // Loading state
    btn.classList.add('loading');
    btn.disabled = true;
    showToast('⏳ جاري الإرسال...', 'loading');

    try {
      const res = await fetch(URLS[type], {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        showToast('✅ تم الإرسال وإشعار الأهل بنجاح!', 'success');
        // Reset form
        if (type === 'checkin') { document.getElementById('ci-child').value = ''; document.getElementById('ci-teacher').value = ''; }
        if (type === 'checkout') { document.getElementById('co-child').value = ''; document.getElementById('co-teacher').value = ''; }
        if (type === 'notes') {
          document.getElementById('nt-child').value = '';
          document.getElementById('nt-teacher').value = '';
          document.getElementById('nt-details').value = '';
          selectedNoteType = ''; selectedMissing = []; selectedAcademic = [];
          document.querySelectorAll('#card-notes .sev-btn').forEach(b => b.className = 'sev-btn');
          document.getElementById('missing-section').style.display = 'none';
          document.getElementById('academic-section').style.display = 'none';
        }

          document.getElementById('inc-child').value = '';
          document.getElementById('inc-teacher').value = '';
          document.getElementById('inc-desc').value = '';
          selectedSeverity = '';
          document.querySelectorAll('.sev-btn').forEach(b => b.className = 'sev-btn');
        }
      } else {
        showToast('❌ حصل خطأ، حاول تاني', 'error');
      }
    } catch (e) {
      showToast('❌ تعذر الاتصال بالسيستم', 'error');
    }

    btn.classList.remove('loading');
    btn.disabled = false;
  }
</script>
</body>
</html>
